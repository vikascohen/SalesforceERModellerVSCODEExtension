name: VS Code Extension CI
on:
  push:
    branches: [main, studio-v2-parity]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test -- --runInBand
      - run: npm run bundle

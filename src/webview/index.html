<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
                   style-src __CSP_SOURCE__ 'unsafe-inline';
                   script-src __CSP_SOURCE__ 'nonce-__NONCE__';
                   img-src __CSP_SOURCE__ data:;">
    <link rel="stylesheet" href="__STYLE_URI__">
    <title>Salesforce ER Modeller</title>
</head>
<body>
    <div id="bootDiagnostic" style="position:fixed;right:12px;bottom:12px;z-index:10000;padding:7px 10px;border:1px solid var(--vscode-panel-border);background:var(--vscode-editorWidget-background);color:var(--vscode-foreground);font:12px monospace">ER runtime: HTML loaded</div>
    <div class="studio-menu-bar">
        <span class="studio-logo">ER</span>
        <span class="studio-name">Diagram Studio</span>
        <span class="studio-spacer"></span>
        <span class="status" id="statusText"></span>
    </div>
    <div class="toolbar studio-toolbar">
        <div class="studio-menu"><button class="studio-menu-trigger">File <span>▾</span></button><div class="studio-menu-popover">
            <button id="openBtn">Open...</button><button id="saveBtn">Save</button><button id="saveAsBtn">Save As...</button>
            <div class="studio-menu-divider"></div><button id="exportMermaidBtn">Copy Mermaid</button><button id="exportDrawioBtn">Export draw.io</button><button id="exportPngBtn">Export PNG</button>
        </div></div>
        <div class="studio-menu"><button class="studio-menu-trigger">Diagram <span>▾</span></button><div class="studio-menu-popover">
            <button id="mimicBtn">Mimic New ER</button><button id="autoLayoutBtn">Auto Layout</button><button id="compareOrgBtn">Compare with Org</button>
        </div></div>
        <div class="studio-menu"><button class="studio-menu-trigger">View <span>▾</span></button><div class="studio-menu-popover">
            <label class="studio-menu-check"><input type="checkbox" id="sharingViewToggle"> Sharing View</label>
            <label class="studio-menu-check"><input type="checkbox" id="heatmapToggle"> Heatmap</label>
            <button id="dictionaryToggleBtn">Data Dictionary</button><button id="architectureBtn">Architecture Intelligence</button><button id="paletteToggleBtn">Object Palette</button>
        </div></div>
        <span class="studio-toolbar-sep"></span>
        <label class="toggle"><input type="checkbox" id="focusToggle"> Focus mode</label>
        <div class="zoom-group"><button id="zoomOutBtn" title="Zoom out">−</button><button id="zoomResetBtn" title="Reset zoom">100%</button><button id="zoomInBtn" title="Zoom in">+</button></div>
        <span class="studio-spacer"></span>
        <div class="autocomplete-wrap studio-import">
            <input id="importNames" type="text" placeholder="Account, Contact, Order__c" title="Object API names, comma-separated">
            <div id="suggestDropdown" class="suggest-dropdown" hidden></div>
        </div>
        <button id="importBtn" class="studio-primary" title="Describe these objects via the Salesforce CLI and add them to the canvas">Import from Org</button>
    </div>
    <div class="studio-tab-bar"><div class="studio-tab active"><span class="studio-tab-dot"></span><span>Untitled Diagram</span></div><span class="studio-tab-hint">ER DSL + visual canvas</span></div>
    <div class="main">
        <div class="dsl-editor-wrap">
            <div class="dsl-editor-header"><span>ER DSL</span><button id="dslCollapseBtn" title="Collapse DSL editor">◀</button><button id="dslExpandBtn" title="Expand DSL editor">Expand</button></div>
            <textarea id="dslEditor" spellcheck="false" placeholder="entity Account : Name, Industry&#10;entity Contact : LastName&#10;Contact.AccountId -&gt; Account"></textarea>
            <div id="dslSuggestDropdown" class="suggest-dropdown" hidden></div>
        </div>
        <button id="dslOpenBtn" class="dsl-open-rail" title="Open DSL editor" hidden>DSL ▶</button>
        <div id="objectPalette" class="object-palette">
            <input id="paletteSearch" type="text" placeholder="Search objects…">
            <div id="paletteList" class="palette-list"></div>
        </div>
        <div class="canvas-wrap">
            <div class="canvas-controls"><button id="canvasMaxBtn">Maximise Canvas</button><button id="fitModelBtn">Fit Model</button><button id="canvasExportBtn">Export</button><button id="canvasSummaryBtn">Show Summary</button></div>
            <div id="canvasSummary" class="canvas-summary" hidden></div>
            <div id="relationshipLegend" class="relationship-legend"><div id="legendDragHead" class="legend-drag-head"><strong>Relationships</strong><button id="legendResetBtn" title="Reset legend position">Reset</button></div><span><i class="legend-line master"></i>Master Detail</span><span><i class="legend-line lookup"></i>Lookup</span><span><i class="legend-line poly"></i>Polymorphic</span></div>
            <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="hoverCard" class="hover-card" hidden></div>
            <div id="linterPanel" class="linter-panel" hidden>
                <div class="linter-header">
                    <span id="linterTitle"></span>
                    <button id="linterAddAllBtn">Add All</button>
                    <button id="linterDismissBtn">Dismiss</button>
                </div>
                <div id="linterList" class="linter-list"></div>
            </div>
        </div>
    </div>

    <div id="dictionaryPanel" class="dictionary-panel" hidden>
        <div class="dictionary-objects">
            <input id="dictionarySearch" type="text" placeholder="Search objects…">
            <div id="dictionaryObjectList" class="dictionary-object-list"></div>
        </div>
        <div class="dictionary-detail">
            <div class="dictionary-detail-header">
                <span id="dictionaryDetailTitle">Select an object</span>
                <button id="dictionaryUsageBtn" hidden>Calculate Usage</button>
                <button id="dictionaryExportBtn" hidden>Export to Excel</button>
                <button id="dictionaryCsvBtn" hidden>Export CSV</button>
                <button id="dictionaryIntelligenceBtn" hidden>Field Intelligence</button>
                <button id="dictionaryCloseBtn" class="return-diagram-btn" title="Return to ER diagram">← Return to Diagram</button>
            </div>
            <div id="dictionaryIntelligence" class="dictionary-intelligence" hidden></div>
            <div id="dictionaryTableWrap" class="dictionary-table-wrap"></div>
        </div>
    </div>

    <div id="mimicModal" class="drift-modal" hidden>
        <div class="mimic-inner"><div class="drift-modal-header"><span>Mimic New ER</span><button id="mimicCloseBtn">✕</button></div>
        <div class="mimic-toolbar"><label>Model name <input id="mimicModelName" value="Mimicked Model"></label><button id="mimicAddObjectBtn">Add Object</button><button id="mimicGenerateBtn">Generate ER</button></div>
        <div id="mimicError" class="mimic-error"></div><div id="mimicBody" class="mimic-body"></div></div>
    </div>

    <div id="architecturePanel" class="architecture-panel" hidden>
        <div class="architecture-header"><div><strong>Architecture Intelligence</strong><div class="architecture-sub">Evidence from the current ER model. No security scoring or invented runtime dependencies.</div></div><button id="architectureExportBtn">Export Report PNG</button><button id="architectureRefreshBtn">Refresh</button><button id="architectureCloseBtn" class="return-diagram-btn" title="Return to ER diagram">← Return to Diagram</button></div>
        <div class="architecture-tabs"><button data-arch-tab="overview" class="active">Overview</button><button data-arch-tab="object">Object Map & Impact</button><button data-arch-tab="path">Path Finder</button><button data-arch-tab="usage">Change Readiness</button><button data-arch-tab="relationships">Relationship Insights</button><button data-arch-tab="junctions">Junction Intelligence</button><button data-arch-tab="domains">Domains</button></div>
        <div id="architectureBody" class="architecture-body"></div>
    </div>

    <div id="driftModal" class="drift-modal" hidden>
        <div class="drift-modal-inner">
            <div class="drift-modal-header">
                <span id="driftTitle">Comparing with org…</span>
                <button id="driftCloseBtn" title="Close">✕</button>
            </div>
            <div id="driftBody" class="drift-modal-body"></div>
        </div>
    </div>

    <script nonce="__NONCE__">window.__LOGIC_URI__ = "__LOGIC_URI__"; window.addEventListener("error",function(e){var d=document.getElementById("bootDiagnostic");if(d)d.textContent="ER runtime ERROR: "+(e.message||"unknown")+" @ "+(e.filename||"")+" :"+(e.lineno||"");}); window.addEventListener("unhandledrejection",function(e){var d=document.getElementById("bootDiagnostic");if(d)d.textContent="ER runtime REJECTION: "+(e.reason&&e.reason.message?e.reason.message:String(e.reason));});</script>
    <script nonce="__NONCE__" src="__SCRIPT_URI__"></script>
</body>
</html>

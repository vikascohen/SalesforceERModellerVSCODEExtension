<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
                   style-src __CSP_SOURCE__ 'unsafe-inline';
                   script-src 'nonce-__NONCE__';
                   img-src __CSP_SOURCE__ data:;">
    <link rel="stylesheet" href="__STYLE_URI__">
    <title>Salesforce ER Modeller</title>
</head>
<body>
    <div class="toolbar">
        <button id="openBtn" title="Open a saved .erd diagram">Open</button>
        <button id="saveBtn" title="Save (Ctrl/Cmd+S)">Save</button>
        <button id="saveAsBtn" title="Save As...">Save As</button>
        <span class="sep"></span>
        <input id="importNames" type="text" placeholder="Account, Contact, Order__c" title="Object API names, comma-separated">
        <button id="importBtn" title="Describe these objects via the Salesforce CLI and add them to the canvas">Import from Org</button>
        <span class="sep"></span>
        <button id="exportMermaidBtn" title="Copy Mermaid erDiagram syntax to the clipboard">Copy Mermaid</button>
        <button id="exportDrawioBtn" title="Export as a draw.io / diagrams.net file">Export draw.io</button>
        <span class="sep"></span>
        <label class="toggle"><input type="checkbox" id="focusToggle"> Focus mode</label>
        <span class="status" id="statusText"></span>
    </div>
    <div class="main">
        <textarea id="dslEditor" spellcheck="false" placeholder="entity Account : Name, Industry&#10;entity Contact : LastName&#10;Contact.AccountId -&gt; Account"></textarea>
        <div class="canvas-wrap">
            <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
    </div>

    <script nonce="__NONCE__">window.__LOGIC_URI__ = "__LOGIC_URI__";</script>
    <script type="module" nonce="__NONCE__" src="__SCRIPT_URI__"></script>
</body>
</html>
